# pnpm 11 blocks dependency build scripts by default; allow only what we trust.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@tailwindcss/oxide': true
  contentlayer: true
  esbuild: true
  prisma: true
  protobufjs: true
  unrs-resolver: true
overrides:
  deepmerge-ts@<8.0.0: ^8.0.0
  esbuild@<=0.24.2: ^0.25.0
  estree-util-value-to-estree@<3.3.3: ^3.3.3
  toml@<4.1.2: ^4.1.2
  toml@<4.2.0: ^4.2.0
  uuid@<11.1.1: ^11.1.1
